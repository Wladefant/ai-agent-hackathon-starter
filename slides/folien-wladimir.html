<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Agent Hackathon — Technische Leitplanken</title>
<style>
:root{
  --orange:#ff6200; --orange-soft:#fff3ea;
  --ink:#15171c; --ink-2:#525866; --ink-3:#878d9c;
  --bg:#fbfaf8; --card:#fff; --line:#e7e4de;
  --green:#0a7f52; --red:#c4372c; --blue:#2f5fd0;
  --u: clamp(11px, 1.02vw, 17px);        /* base unit — drives everything */
}
html[data-theme="dark"]{
  --orange:#ff8038; --orange-soft:#2b1a10;
  --ink:#f1f0ed; --ink-2:#a7acb8; --ink-3:#767c8b;
  --bg:#0f1115; --card:#171a20; --line:#272b34;
  --green:#3ddc97; --red:#ff6b5e; --blue:#7aa2ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}

#stage{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;
  padding:calc(var(--u)*1.6)}
.slide{display:none;width:100%;max-width:calc(var(--u)*76);height:100%;max-height:calc(var(--u)*43);
  flex-direction:column}
.slide.on{display:flex;animation:in .3s cubic-bezier(.2,.7,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* type — everything derives from --u so nothing ever looks "zoomed" */
.kicker{font-size:calc(var(--u)*.86);letter-spacing:.13em;text-transform:uppercase;
  color:var(--orange);font-weight:700;margin-bottom:calc(var(--u)*.5)}
h1{font-size:calc(var(--u)*3.1);line-height:1.05;letter-spacing:-.026em;font-weight:800}
h2{font-size:calc(var(--u)*2);line-height:1.12;letter-spacing:-.02em;font-weight:800;
  margin-bottom:calc(var(--u)*.4)}
h3{font-size:calc(var(--u)*1.08);font-weight:750;letter-spacing:-.008em;margin-bottom:calc(var(--u)*.45)}
.sub{font-size:calc(var(--u)*1.05);color:var(--ink-2);line-height:1.45;margin-top:calc(var(--u)*.5)}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
em.hl{font-style:normal;color:var(--orange)}

.cols{display:grid;gap:calc(var(--u)*.85)}
.cols>*{min-width:0}          /* sonst sprengt eine breite Tabelle die Spur */
.grow>*{min-width:0;max-width:100%}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}
.c21{grid-template-columns:1.35fr 1fr}

.card{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--u)*.7);
  padding:calc(var(--u)*.95) calc(var(--u)*1.1)}
.card p,.card li{font-size:calc(var(--u)*.92);line-height:1.5;color:var(--ink-2)}
.card ul{list-style:none}
.card li{padding-left:calc(var(--u)*.95);position:relative;margin:calc(var(--u)*.28) 0}
.card li::before{content:"";position:absolute;left:0;top:.63em;width:calc(var(--u)*.32);
  height:calc(var(--u)*.32);border-radius:50%;background:var(--orange)}
.card.good{border-color:color-mix(in srgb,var(--green) 42%,var(--line))}
.card.bad{border-color:color-mix(in srgb,var(--red) 38%,var(--line))}
.card.good h3{color:var(--green)} .card.bad h3{color:var(--red)}
.card.good li::before{background:var(--green)} .card.bad li::before{background:var(--red)}
.card.accent{background:var(--orange-soft);border-color:color-mix(in srgb,var(--orange) 38%,var(--line))}
.card.accent p,.card.accent li{color:var(--ink)}

table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:calc(var(--u)*.9)}
th,td{padding:calc(var(--u)*.5) calc(var(--u)*.62);text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top}
th{font-size:calc(var(--u)*.72);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  font-weight:750}
td.lbl{color:var(--ink);font-weight:650}
th,td{overflow-wrap:anywhere}
th.pick,td.pick{background:var(--orange-soft)}
th.pick{color:var(--orange)}
.yes{color:var(--green);font-weight:750}
.no{color:var(--red);font-weight:750}
.meh{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums;font-weight:750;color:var(--orange)}

.flow{display:flex;align-items:center;gap:calc(var(--u)*.5);flex-wrap:wrap}
.node{background:var(--card);border:1.5px solid var(--line);border-radius:calc(var(--u)*.55);
  padding:calc(var(--u)*.62) calc(var(--u)*.85);font-size:calc(var(--u)*.9);font-weight:640;line-height:1.3}
.node.human{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
.arrow{color:var(--ink-3);font-size:calc(var(--u)*1.2)}

.switch{display:flex;align-items:center;gap:calc(var(--u)*.7);background:var(--orange);color:#fff;
  border-radius:calc(var(--u)*.6);padding:calc(var(--u)*.62) calc(var(--u)*.95);
  margin-bottom:calc(var(--u)*.8);font-size:calc(var(--u)*1);font-weight:750}
.switch .sm{font-weight:500;opacity:.93;font-size:calc(var(--u)*.85)}

.steps{counter-reset:st;display:flex;flex-direction:column;gap:calc(var(--u)*.34)}
.step{counter-increment:st;display:grid;grid-template-columns:calc(var(--u)*1.5) 1fr;
  gap:calc(var(--u)*.7);align-items:baseline;background:var(--card);border:1px solid var(--line);
  border-radius:calc(var(--u)*.5);padding:calc(var(--u)*.52) calc(var(--u)*.8)}
.step::before{content:counter(st);font-weight:800;color:#fff;background:var(--orange);
  width:calc(var(--u)*1.35);height:calc(var(--u)*1.35);border-radius:50%;display:grid;
  place-items:center;font-size:calc(var(--u)*.76)}
.step .s{font-size:calc(var(--u)*.94);line-height:1.4}
.step .s em{font-style:normal;color:var(--ink-3);font-size:calc(var(--u)*.82);display:block}
code{font-family:"Cascadia Mono",ui-monospace,Consolas,monospace;
  background:var(--orange-soft);padding:1px calc(var(--u)*.25);border-radius:4px;
  font-size:.94em;color:var(--ink)}

.src{font-size:calc(var(--u)*.68);color:var(--ink-3);margin-top:calc(var(--u)*.55)}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*.72);
  color:var(--ink-3);padding-top:calc(var(--u)*.7);margin-top:auto}

#bar{position:fixed;left:0;top:0;height:3px;background:var(--orange);z-index:40;transition:width .3s}
#hud{position:fixed;right:120px;bottom:13px;font-size:12px;color:var(--ink-3);
  font-family:ui-monospace,monospace;z-index:40}
#nav2{position:fixed;right:14px;bottom:8px;z-index:45;display:flex;gap:6px}
#nav2 button{width:44px;height:38px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;
  display:grid;place-items:center;font-family:inherit}
#nav2 button:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
#nav2 button:disabled{opacity:.32;cursor:default}
#hint{position:fixed;left:14px;bottom:11px;font-size:12px;color:var(--ink-3);z-index:40;transition:opacity .6s}

#notes{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;z-index:50;
  background:var(--card);border-top:3px solid var(--orange);padding:18px 26px 24px;display:none}
#notes.on{display:block}
#notes h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
#notes p{font-size:15.5px;line-height:1.58;margin-bottom:8px;max-width:110ch}
#notes .cue{color:var(--ink-3);font-style:italic;font-size:14px}

#grid{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;
  grid-template-columns:repeat(4,1fr);gap:12px;padding:22px;overflow:auto;align-content:start}
#grid.on{display:grid}
.thumb{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;
  background:var(--card);min-height:88px}
.thumb:hover{border-color:var(--orange)}
.thumb .n{font-size:10.5px;color:var(--ink-3);font-family:ui-monospace,monospace}
.thumb .t{font-size:13.5px;font-weight:700;margin-top:4px;line-height:1.28}

/* ---------- Druck / PDF: jede Folie eine Seite, quer ---------- */
@media print{
  @page{size:1280px 720px;margin:0}
  :root{--u:16px}                     /* feste Größe, unabhängig vom Fenster */
  html,body{height:auto;overflow:visible;background:#fff}
  #bar,#hud,#hint,#nav2,#notes,#grid{display:none !important}
  #stage{position:static;display:block;padding:0}
  .slide{
    display:flex !important;
    width:1280px;height:720px;max-width:none;max-height:none;
    padding:56px 68px;background:#fff;
    break-after:page;page-break-after:always;animation:none
  }
  .slide:last-child{break-after:auto;page-break-after:auto}
  .card,.node,.step,.tab{break-inside:avoid}
  .switch,.card.accent,th.pick,td.pick,.step::before,.num{
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="bar"></div><div id="stage"></div><div id="grid"></div>
<div id="notes"><h4>Sprechtext</h4><div id="notesBody"></div></div>
<div id="hint">← → oder Knöpfe unten rechts · linkes Drittel klicken = zurück · <b>N</b> Sprechtext · <b>O</b> Übersicht · <b>D</b> dunkel · <b>F</b> Vollbild</div>
<div id="hud"></div>
<div id="nav2">
  <button id="prev" title="Zurück (Pfeil links)">‹</button>
  <button id="next" title="Weiter (Pfeil rechts)">›</button>
</div>

const SLIDES = [
{

  ["say","Konkret: Der Name darf 30 Zeichen haben, die Beschreibung 1.000, und die Instructions — das eigentliche Gehirn — 8.000 Zeichen. Bis zu 20 Wissensquellen."],

{
 title:"Agent oder Chatbot",
 html:`<div class="kicker">Kurz die gemeinsame Sprache</div>
  <h2>Wann lohnt sich überhaupt ein Agent?</h2>
  <div class="grow">
   <div class="cols c2" style="margin-bottom:calc(var(--u)*.85)">
    <div class="card"><h3>Chatbot</h3>
      <p>Du fragst, es antwortet. Den nächsten Schritt machst du.
      Einmalige Frage, einmalige Antwort.</p></div>
    <div class="card accent"><h3 style="color:var(--orange)">Agent</h3>
      <p>Du gibst ein <b>Ziel</b> und feste Regeln. Er zerlegt in Schritte, arbeitet sie ab,
      prüft sein Ergebnis gegen die Regeln — und ist <b>wiederverwendbar</b>: zwanzig Leute
      benutzen denselben.</p></div>
   </div>
   <div class="card">
    <h3>Die zwei Bedingungen — beide müssen erfüllt sein</h3>
    <div class="cols c2" style="margin-top:calc(var(--u)*.4)">
     <p><b>1. Mehrere Schritte.</b> Bei einem Schritt reicht ein guter Prompt.
        Baut keinen Agenten drumherum, das kostet nur Zeit.</p>
     <p><b>2. Prüfbares Ergebnis.</b> Ihr müsst sagen können, woran man erkennt,
        dass die Ausgabe gut ist. Sonst kann sie niemand freigeben.</p>
    </div>
   </div>
   <div class="sub" style="font-size:calc(var(--u)*.95)">Wer bei Bedingung 2 hängt, holt einen Coach.
     Das ist der Punkt, an dem ein Use Case entweder scharf wird oder still scheitert.</div>
  </div>
  <div class="foot"><span>4 von 4 · Handwerk</span><span></span></div>`,
 notes:[
  ["say","Kurz die gemeinsame Sprache. Ein Chatbot antwortet — ihr fragt, es kommt was zurück. Ein Agent bekommt ein Ziel und feste Regeln, zerlegt selbst in Schritte und prüft sein Ergebnis gegen diese Regeln. Und, das ist der praktische Unterschied: Er ist wiederverwendbar. Zwanzig Leute benutzen denselben Agenten."],
  ["say","Zwei Bedingungen, und beide müssen erfüllt sein. Erstens: mehrere Schritte. Bei einem Schritt reicht ein guter Prompt. Zweitens: prüfbares Ergebnis. Ihr müsst sagen können, woran man erkennt, dass die Ausgabe gut ist."],
  ["cue","Das ist deine wichtigste Coaching-Folie. Beim Rumlaufen immer wieder darauf zurückkommen."]
 ]
},
{
 title:"Prompt-Aufbau",
 html:`<div class="kicker">Der häufigste Fehler ist ein zu kurzer Auftrag</div>
  <h2>Vier Teile — und einer wird fast immer vergessen</h2>
  <div class="grow">
   <table>
    <tr><th style="width:14%">Teil</th><th style="width:36%">Beantwortet</th><th>Beispiel</th></tr>
    <tr><td class="lbl" style="color:var(--orange)">ROLLE</td><td>Wer ist der Agent — und wofür <b>nicht</b>?</td>
        <td>„Du unterstützt eine Testerin. Du schreibst in kein System."</td></tr>
    <tr><td class="lbl" style="color:var(--orange)">AUFGABE</td><td>Was genau ist zu tun, in welcher Reihenfolge?</td>
        <td>„Leite Testfälle ab: Happy Path, Fehler, Grenzwerte, Berechtigungen."</td></tr>
    <tr><td class="lbl" style="color:var(--orange)">REGELN</td><td>Was ist Pflicht, was verboten?</td>
        <td>„Übernimm Feldnamen wörtlich. Erfinde keine Bezeichnungen."</td></tr>
    <tr><td class="lbl" style="color:var(--orange)">FORMAT</td><td>Wie sieht die Antwort aus?</td>
        <td>„Tabelle mit genau diesen Spalten: ID, Titel, Vorbedingung, Schritte…"</td></tr>
   </table>
   <div class="cols c2" style="margin-top:calc(var(--u)*.8)">
     <div class="card bad"><h3>Ohne FORMAT</h3><p>kommt Fließtext zurück, und ihr sortiert
       das Ergebnis von Hand nach. Kostet mehr Zeit, als der Agent gespart hat.</p></div>
     <div class="card bad"><h3>Ohne REGELN</h3><p>bewertet das Modell nach Gefühl — und zwar
       jedes Mal anders. Zwei Durchläufe, zwei Ergebnisse, kein Vertrauen.</p></div>
   </div>
  </div>
  <div class="foot"><span>4 von 4 · Handwerk</span><span></span></div>`,
 notes:[
  ["say","Der häufigste Fehler heute Nachmittag wird ein zu kurzer Auftrag sein. Ein Prompt, der trägt, hat vier Teile: Rolle, Aufgabe, Regeln, Format."],

  ["say","Ohne Format kommt Fließtext zurück, und ihr sortiert von Hand nach. Das kostet mehr Zeit, als der Agent gespart hat. Ohne Regeln bewertet das Modell nach Gefühl, und zwar jedes Mal anders. Zwei Durchläufe, zwei Ergebnisse, kein Vertrauen."]

{
 title:"Der FEHLT-Satz",
 html:`<div class="kicker">Die eine Zeile, die in jeden Prompt gehört</div>
  <h2>Warum Modelle Lücken füllen — und was dagegen hilft</h2>
  <div class="grow">
   <div class="card accent" style="padding:calc(var(--u)*1.3) calc(var(--u)*1.5)">
    <div style="font-family:'Cascadia Mono',ui-monospace,monospace;font-size:calc(var(--u)*1.45);
      line-height:1.45;font-weight:600">Erfinde nichts. Fehlt eine Angabe, schreib <b>FEHLT</b>
      und formuliere die Rückfrage.</div>
   </div>
   <div class="cols c2" style="margin-top:calc(var(--u)*.9)">
    <div class="card bad"><h3>Ohne diesen Satz</h3>
      <p>Ein Modell antwortet lieber plausibel als gar nicht. Es erfindet einen Feldnamen,
      eine Frist, eine Zuständigkeit — und <b>man sieht dem Ergebnis nicht an, was echt war.</b>
      Das ist der gefährlichste Fehlermodus, weil das Ergebnis gut aussieht.</p></div>
    <div class="card good"><h3>Mit diesem Satz</h3>
      <p>Ihr bekommt statt einer erfundenen Antwort eine ehrliche Lücke — und eine Rückfrage,
      die ihr weiterleiten könnt. <b>Ein Ergebnis mit drei FEHLT-Markern ist besser
      als eines ohne.</b></p></div>
   </div>
   <div class="sub" style="font-size:calc(var(--u)*.95)">In einer Bank ist das der Unterschied
     zwischen brauchbar und gefährlich. Der Satz steht in allen sechs Prompts im Repo drin.</div>
  </div>
  <div class="foot"><span>4 von 4 · Handwerk</span><span></span></div>`,
 notes:[
  ["say","Und dann der eine Satz, der in jeden Prompt gehört, egal welcher Use Case: Erfinde nichts. Fehlt eine Angabe, schreib FEHLT und formuliere die Rückfrage."],
  ["say","Warum das nötig ist: Ein Modell antwortet lieber plausibel als gar nicht. Es erfindet einen Feldnamen, eine Frist, eine Zuständigkeit — und man sieht dem Ergebnis nicht an, was echt war und was erfunden. Das ist der gefährlichste Fehlermodus überhaupt, weil das Ergebnis dabei gut aussieht."],
  ["say","Mit dem Satz bekommt ihr statt einer erfundenen Antwort eine ehrliche Lücke und eine Rückfrage, die ihr weiterleiten könnt. Ein Ergebnis mit drei FEHLT-Markern ist ein besseres Ergebnis als eines ohne."]
 ]
},

    <div class="card"><h3>Was der Agent tut</h3><p>Übersetzt in beide Richtungen, erkennt die
      Richtung selbst, zieht Fachbegriffe aus einem angehängten Glossar und lässt Beträge,
      IDs und Zuständigkeiten unangetastet.</p></div>
    <div class="card accent"><h3 style="color:var(--orange)">Worauf ihr schauen sollt</h3>
      <p>Unter der Übersetzung steht ein <b>Audit-Log</b>: welcher Begriff kam aus dem

   <div class="card" style="margin-top:calc(var(--u)*.85)">
    <p><b>Der Punkt:</b> Nicht die Übersetzung ist das Kunststück, das kann jedes Modell.

      trauen darf. Genau das meinte ich mit „prüfbares Ergebnis" —
      <b>und es kostet drei Zeilen Prompt.</b></p>
   </div>

const stage=document.getElementById('stage'),gridEl=document.getElementById('grid'),
  notesEl=document.getElementById('notes'),notesBody=document.getElementById('notesBody'),
  bar=document.getElementById('bar'),hud=document.getElementById('hud'),hint=document.getElementById('hint');
let i=0,notesOn=false;

SLIDES.forEach((s,n)=>{
  const d=document.createElement('div');
  d.className='slide';d.dataset.n=n;d.innerHTML=s.html;stage.appendChild(d);
  const t=document.createElement('div');t.className='thumb';
  t.innerHTML='<div class="n">'+String(n+1).padStart(2,'0')+'</div><div class="t">'+s.title+'</div>';
  t.onclick=()=>{go(n);toggleGrid(false)};gridEl.appendChild(t);
});
function renderNotes(){
  notesBody.innerHTML=(SLIDES[i].notes||[]).map(([k,t])=>
    k==='cue'?'<p class="cue">▸ '+t+'</p>':'<p>„'+t+'"</p>').join('');
}
const prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');
function go(n){
  i=Math.max(0,Math.min(SLIDES.length-1,n));
  document.querySelectorAll('.slide').forEach(el=>el.classList.toggle('on',+el.dataset.n===i));
  bar.style.width=((i+1)/SLIDES.length*100)+'%';
  hud.textContent=(i+1)+' / '+SLIDES.length;
  prevBtn.disabled=i===0; nextBtn.disabled=i===SLIDES.length-1;
  renderNotes();location.hash=i+1;
}
prevBtn.onclick=e=>{e.stopPropagation();go(i-1)};
nextBtn.onclick=e=>{e.stopPropagation();go(i+1)};
function toggleNotes(v){
  notesOn=v===undefined?!notesOn:v;
  notesEl.classList.toggle('on',notesOn);
  stage.style.paddingBottom=notesOn?'42vh':'';
}
function toggleGrid(v){
  gridEl.classList.toggle('on',v===undefined?!gridEl.classList.contains('on'):v);
}
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){go(i+1);e.preventDefault()}
  else if(k==='ArrowLeft'||k==='PageUp'){go(i-1);e.preventDefault()}
  else if(k==='Home'){go(0)}else if(k==='End'){go(SLIDES.length-1)}
  else if(k==='n'||k==='N'){toggleNotes()}
  else if(k==='o'||k==='O'||k==='Escape'){toggleGrid()}
  else if(k==='d'||k==='D'){const c=document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark')}
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen()
    :document.documentElement.requestFullscreen().catch(()=>{})}
});
addEventListener('click',e=>{
  if(gridEl.classList.contains('on')||notesEl.contains(e.target))return;
  if(e.target.closest('#nav2'))return;
  go(e.clientX<innerWidth*0.33?i-1:i+1);   // linkes Drittel = zurück
});
setTimeout(()=>{hint.style.opacity='0'},6000);
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
</script>
</body>
