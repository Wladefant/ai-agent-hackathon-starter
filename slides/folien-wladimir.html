<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Agent Hackathon — Technische Leitplanken</title>
<style>
:root{
  --orange:#ff6200;
  --orange-soft:#fff1e6;
  --ink:#16181d;
  --ink-2:#5a6070;
  --ink-3:#8b91a1;
  --bg:#faf9f7;
  --card:#ffffff;
  --line:#e6e3dd;
  --green:#0a8754;
  --red:#c8362a;
}
html[data-theme="dark"]{
  --orange:#ff7a26;
  --orange-soft:#2a1a0e;
  --ink:#f2f1ee;
  --ink-2:#a8adba;
  --ink-3:#767c8b;
  --bg:#101216;
  --card:#181b21;
  --line:#282c35;
  --green:#3ddc97;
  --red:#ff6b5e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;display:grid;place-items:center}
.slide{
  position:absolute; width:1280px; height:720px; padding:70px 84px;
  display:none; flex-direction:column; background:var(--bg);
}
.slide.on{display:flex; animation:in .34s cubic-bezier(.2,.7,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- type ---------- */
.kicker{
  font-size:15px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--orange);font-weight:700;margin-bottom:16px
}
h1{font-size:66px;line-height:1.03;letter-spacing:-.028em;font-weight:800}
h2{font-size:46px;line-height:1.08;letter-spacing:-.022em;font-weight:800;margin-bottom:10px}
h3{font-size:23px;font-weight:700;letter-spacing:-.01em}
.sub{font-size:23px;color:var(--ink-2);line-height:1.45;margin-top:16px;max-width:64ch}
.big{font-size:44px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
.mono{font-family:"Cascadia Mono",ui-monospace,Consolas,monospace}
em.hl{font-style:normal;color:var(--orange)}
strong{font-weight:800}

/* ---------- layout helpers ---------- */
.grow{flex:1;display:flex;flex-direction:column;justify-content:center}
.cols{display:grid;gap:26px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr)}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 28px;
}
.card h3{margin-bottom:12px}
.card p,.card li{font-size:18px;line-height:1.55;color:var(--ink-2)}
.card ul{list-style:none}
.card li{padding-left:20px;position:relative;margin:7px 0}
.card li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;
  border-radius:50%;background:var(--orange)}

.card.good{border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.card.bad{border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.card.good h3{color:var(--green)} .card.bad h3{color:var(--red)}
.card.good li::before{background:var(--green)} .card.bad li::before{background:var(--red)}
.card.accent{background:var(--orange-soft);border-color:color-mix(in srgb,var(--orange) 35%,var(--line))}

/* ---------- statement slide ---------- */
.statement{
  border-left:8px solid var(--orange);padding:6px 0 6px 34px;
}
.statement .big{max-width:22ch}
.statement .why{font-size:21px;color:var(--ink-2);margin-top:22px;max-width:60ch;line-height:1.5}

/* ---------- table ---------- */
table{border-collapse:collapse;width:100%;font-size:18px}
th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
td.lbl{color:var(--ink-2);font-weight:600}
th.pick,td.pick{background:var(--orange-soft)}
th.pick{color:var(--orange)}
.yes{color:var(--green);font-weight:700}
.no{color:var(--red);font-weight:700}
.meh{color:var(--ink-3)}

/* ---------- diagrams ---------- */
.flow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.node{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:16px 20px;font-size:17px;font-weight:650;line-height:1.3
}
.node.human{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
.arrow{color:var(--ink-3);font-size:24px;line-height:1}

.stack{display:flex;flex-direction:column;gap:10px}
.part{
  display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 20px
}
.part .tag{
  font-size:14px;font-weight:800;letter-spacing:.1em;color:var(--orange);
  border-right:1px solid var(--line);padding-right:14px
}
.part .txt{font-size:17.5px;color:var(--ink-2);line-height:1.45}

.split{display:grid;grid-template-columns:1fr auto 1fr;gap:30px;align-items:center}
.vs{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--orange);color:#fff;font-weight:800;font-size:14px
}

/* ---------- footer / chrome ---------- */
.foot{
  display:flex;justify-content:space-between;align-items:center;
  font-size:14px;color:var(--ink-3);padding-top:22px;margin-top:auto
}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--orange);z-index:40;transition:width .3s}
#hud{
  position:fixed;right:16px;bottom:14px;font-size:12.5px;color:var(--ink-3);
  font-family:ui-monospace,monospace;z-index:40;user-select:none
}
#hint{
  position:fixed;left:16px;bottom:14px;font-size:12.5px;color:var(--ink-3);z-index:40;
  transition:opacity .5s
}

/* ---------- notes ---------- */
#notes{
  position:fixed;left:0;right:0;bottom:0;max-height:44vh;overflow:auto;z-index:50;
  background:var(--card);border-top:3px solid var(--orange);
  padding:22px 30px 26px;display:none;box-shadow:0 -16px 40px rgba(0,0,0,.14)
}
#notes.on{display:block}
#notes h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
#notes p{font-size:16.5px;line-height:1.6;color:var(--ink);max-width:105ch;margin-bottom:9px}
#notes .say{border-left:3px solid var(--line);padding-left:14px}
#notes .cue{color:var(--ink-3);font-size:14.5px;font-style:italic}

/* ---------- overview ---------- */
#grid{
  position:fixed;inset:0;background:var(--bg);z-index:60;display:none;
  grid-template-columns:repeat(4,1fr);gap:14px;padding:26px;overflow:auto;align-content:start
}
#grid.on{display:grid}
.thumb{
  border:2px solid var(--line);border-radius:11px;padding:14px;cursor:pointer;
  background:var(--card);min-height:104px
}
.thumb:hover{border-color:var(--orange)}
.thumb .n{font-size:11px;color:var(--ink-3);font-family:ui-monospace,monospace}
.thumb .t{font-size:14.5px;font-weight:700;margin-top:5px;line-height:1.3}
</style>
</head>
<body>

<div id="bar"></div>
<div id="stage"></div>
<div id="grid"></div>
<div id="notes"><h4>Sprechtext</h4><div id="notesBody"></div></div>
<div id="hint">← → blättern · <b>N</b> Sprechtext · <b>O</b> Übersicht · <b>D</b> dunkel · <b>F</b> Vollbild</div>

/* ---------------- engine ---------------- */
const stage=document.getElementById('stage'), gridEl=document.getElementById('grid'),
      notesEl=document.getElementById('notes'), notesBody=document.getElementById('notesBody'),
      bar=document.getElementById('bar'), hud=document.getElementById('hud'),
      hint=document.getElementById('hint');
let i=0, notesOn=false;

SLIDES.forEach((s,n)=>{
  const d=document.createElement('div');
  d.className='slide'; d.dataset.n=n; d.innerHTML=s.html;
  stage.appendChild(d);
  const t=document.createElement('div');
  t.className='thumb';
  t.innerHTML='<div class="n">'+String(n+1).padStart(2,'0')+'</div><div class="t">'+s.title+'</div>';
  t.onclick=()=>{go(n);toggleGrid(false)};
  gridEl.appendChild(t);
});

function fit(){
  const s=Math.min(innerWidth/1280, (innerHeight - (notesOn?innerHeight*0.44:0))/720);
  document.querySelectorAll('.slide').forEach(el=>{
    el.style.transform='scale('+s+')';
    el.style.transformOrigin='center center';
  });
  stage.style.alignItems = notesOn ? 'flex-start' : 'center';
  stage.style.paddingBottom = notesOn ? '44vh' : '0';
}
function renderNotes(){
  const s=SLIDES[i];
  notesBody.innerHTML=(s.notes||[]).map(([k,t])=>
    k==='cue' ? '<p class="cue">▸ '+t+'</p>' : '<p class="say">„'+t+'"</p>').join('');
}
function go(n){
  i=Math.max(0,Math.min(SLIDES.length-1,n));
  document.querySelectorAll('.slide').forEach(el=>
    el.classList.toggle('on', +el.dataset.n===i));
  bar.style.width=((i+1)/SLIDES.length*100)+'%';
  hud.textContent=(i+1)+' / '+SLIDES.length;
  renderNotes(); fit();
  location.hash=i+1;
}
function toggleNotes(v){
  notesOn = v===undefined ? !notesOn : v;
  notesEl.classList.toggle('on',notesOn); fit();
}
function toggleGrid(v){
  const on = v===undefined ? !gridEl.classList.contains('on') : v;
  gridEl.classList.toggle('on',on);
}
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){go(i+1);e.preventDefault()}
  else if(k==='ArrowLeft'||k==='PageUp'){go(i-1);e.preventDefault()}
  else if(k==='Home'){go(0)} else if(k==='End'){go(SLIDES.length-1)}
  else if(k==='n'||k==='N'){toggleNotes()}
  else if(k==='o'||k==='O'||k==='Escape'){toggleGrid()}
  else if(k==='d'||k==='D'){
    const cur=document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
  }
  else if(k==='f'||k==='F'){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }
});
addEventListener('resize',fit);
addEventListener('click',e=>{
  if(gridEl.classList.contains('on')||notesEl.contains(e.target))return;
  go(e.clientX < innerWidth*0.28 ? i-1 : i+1);
});
setTimeout(()=>{hint.style.opacity='0'},6000);
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
</script>
